<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="peak" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5eecc4"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#cd7f32"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>
  <!-- 背景天空 -->
  <rect width="900" height="900" fill="url(#sky)"/>
  <!-- 远山 -->
  <polygon points="0,520 220,280 420,520" fill="#0369a1" opacity="0.5"/>
  <polygon points="280,520 520,220 760,520" fill="url(#peak)" opacity="0.7"/>
  <polygon points="580,520 820,320 900,520" fill="#059669" opacity="0.5"/>
  <!-- 地面 -->
  <rect y="520" width="900" height="380" fill="#065f46"/>
  <!-- 铜车马主体 -->
  <ellipse cx="450" cy="620" rx="280" ry="40" fill="#000" opacity="0.25"/>
  <g transform="translate(450,580)">
    <rect x="-120" y="-20" width="240" height="50" rx="8" fill="url(#bronze)"/>
    <circle cx="-90" cy="35" r="28" fill="#78350f" stroke="#fde68a" stroke-width="4"/>
    <circle cx="90" cy="35" r="28" fill="#78350f" stroke="#fde68a" stroke-width="4"/>
    <path d="M-60 -80 Q0 -140 80 -60 L100 -20 L-80 -20 Z" fill="url(#bronze)"/>
    <path d="M80 -60 Q140 -100 180 -40 L160 0 L100 -20 Z" fill="#d4af37"/>
  </g>
  <!-- 装饰网格线（拼图参考线，不影响游玩） -->
  <g stroke="#ffffff" stroke-width="2" opacity="0.08">
    <line x1="300" y1="0" x2="300" y2="900"/>
    <line x1="600" y1="0" x2="600" y2="900"/>
    <line x1="0" y1="300" x2="900" y2="300"/>
    <line x1="0" y1="600" x2="900" y2="600"/>
  </g>
</svg>
